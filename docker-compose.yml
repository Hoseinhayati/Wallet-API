version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: digitalwallet-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - digitalwallet-network

  redis:
    image: redis:7-alpine
    container_name: digitalwallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - digitalwallet-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: digitalwallet-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - digitalwallet-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: digitalwallet-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - digitalwallet-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: digitalwallet-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    networks:
      - digitalwallet-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: digitalwallet-kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks:
      - digitalwallet-network

  seq:
    image: datalust/seq:latest
    container_name: digitalwallet-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=MySecurePass123!
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - digitalwallet-network

networks:
  digitalwallet-network:
    driver: bridge

volumes:
  sqlserver-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  seq-data:
