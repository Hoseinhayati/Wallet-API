version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: digitalwallet-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - digitalwallet-network

  redis:
    image: redis:7-alpine
    container_name: digitalwallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - digitalwallet-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: digitalwallet-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - digitalwallet-network

  seq:
    image: datalust/seq:latest
    container_name: digitalwallet-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=MySecurePass123!
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - digitalwallet-network

networks:
  digitalwallet-network:
    driver: bridge

volumes:
  sqlserver-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  seq-data:
